<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>about us</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
             font-family: 'Vazir', sans-serif;
        }
        .aboutus{
 background-image: url(./images/aboutus.jpg);
 background-size: cover;
 background-repeat: no-repeat;
 background-position: center;
 height: 100vh;
}



#note-text {
position: absolute;
top: 35%;    
left: 75%; 
transform: translate(-50%, -50%);
width: 200px;   
text-align: center;
font-size: 40px;
transform: translate(-50%,-50%)rotate(17deg);
color: rgb(214, 40, 40);

}

.p-text{
    position: absolute;
top: 65%;
left: 70%;
transform: translate(-50%, -50%);
width: 200px;
text-align: center;
font-size: 20px;
transform: translate(-50%,-50%)rotate(17deg);
justify-content: center;
text-align: center;
}

.btn {
position:absolute;
padding: 10px 20px;
background-color:rgb(214, 40, 40);
color: white;
text-decoration: none;
border-radius: 8px;
font-weight: bold;
top:0%;
margin: 10px;
}

.btn:hover {
opacity: 0.8;
}
    </style>
</head>
<body>
    <div class="aboutus"></div>

   
        <h1 id="note-text"></h1>
        <p class="p-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aut ut soluta explicabo consequuntur dolore, temporibus laboriosam tenetur eos alias aspernatur beatae non sit possimus voluptate sunt perferendis cum? Atque, reiciendis?</p>
  
  
        <a href="index.html" class="btn">Home</a>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            const text = "about us"; 
            const speed = 120; 
            let index = 0;

            function typeWriter() {
            if (index < text.length) {
            document.getElementById("note-text").innerHTML += text.charAt(index);
            index++;
            setTimeout(typeWriter, speed);
            }
                }

            window.onload = typeWriter;

        </script>
</body>
</html>
